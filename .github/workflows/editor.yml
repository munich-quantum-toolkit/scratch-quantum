name: Editor

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# A new push to a pull request cancels its older run. Runs on main all finish, so every merge is deployed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and build
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read # Needed to check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('upstream.json', 'patches/**') }}
          restore-keys: npm-
      - run: npm run test:scripts
      - run: npm run setup
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor
          path: build/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push to gh-pages
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: editor
          path: build
      - run: touch build/.nojekyll
      # single-commit keeps gh-pages to one commit; clean-exclude keeps the pull request previews.
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: build
          clean-exclude: pr-preview/
          single-commit: true

  preview:
    name: Preview
    needs: build
    # Runs after a successful build, or to remove the preview when the pull request closes.
    # Pull requests from forks get no preview: their workflows can't push to this repository.
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.build.result == 'success' || github.event.action == 'closed')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push the preview to gh-pages
      pull-requests: write # Needed to comment the preview link on the pull request
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event.action != 'closed'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: editor
          path: build
      # GitHub Pages sites may hold at most 1 GB, so previews keep only what the editor loads.
      - if: github.event.action != 'closed'
        run: |
          rm -f build/player.* build/blocksonly.* build/blocks-only.html build/compatibilitytesting.* build/compatibility-testing.html
          find build -name '*.map' -delete
          du -sh build
      # pr-preview-action does nothing for "reopened" in auto mode, so the action is set explicitly.
      - uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: build
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: ${{ github.event.action == 'closed' && 'remove' || 'deploy' }}
