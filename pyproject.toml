[project]
name = "scratch-quantum-docs"
version = "0.0.0"
description = "Documentation of the quantum computing extension for Scratch"
requires-python = ">=3.12"

[dependency-groups]
docs = [
    "furo>=2025.9.25",
    "myst-parser>=4.0.1",
    "sphinx>=8.2.3",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
    "sphinxcontrib-bibtex>=2.6.5",
    "sphinxext-opengraph>=0.10.0",
]

[tool.uv]
package = false
